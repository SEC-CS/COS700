[project]
name = "cos700"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shravan Seebran", email = "shravanseebran@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "metamath-py>=0.1.0",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "torch>=2.13.0",
    "torchvision>=0.29.0",
    "transformers>=5.14.1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
]
